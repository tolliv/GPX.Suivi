<!DOCTYPE html>
<html lang="fr">
<head>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>GPX.Suivi</title>
  <meta charset='UTF-8'>
</head>
<body>

  <!----- PARTIE ADMIN ----->
  <link rel='stylesheet' type='text/css' href='main.css'>
  <script src='main.js?v=2610.18a'> </script>
  <script src='driverSupabase.js?v=2610.18a'> </script>
  <div id='divPageContainer'>
    <div id='divAdmin' style='display: none'>
      <b>Admin</b><br>
      <button id='btnSTest'       onclick='ButTestClick()'>T</button>
      <button id='btnSEnvoi'      onclick='ButEnvoiClick()'>W</button>
      <button id='btnSLecture1'   onclick='ButLectureClick(1)'>R1</button>
      <button id='btnSLecture10'  onclick='ButLectureClick(10)'>R10</button>
      <button id='btnSClear'      onclick='ButClearClick()'>Clr</button>
      <button id='btnSLoad'       onclick='ButLoadClick()'>Charge GPX</button>
    </div>

    <!----- PARTIE Titre ----->
    <div id='titreSuivi' style='font-size: x-large;'>
      <span id='parTitre'><b>GPX.Suivi</b> de Thierry</span>
      <span id='divAvancement'></span>
    </div>

    <!----- PARTIE Progression ----->
    <div id='divProgression'>
      <div id='progression-container'>
        <span id='spanDeplacementCurseur'><img id='imgCurseur'></span>
        <span id='txtHeurePosition'></span>
        <div id='progression-track'></div>
        <div id='progression-fill'></div>
      </div>
      <div id="progression-labels">
        <span id='spanDistanceMin'>0km</span><span id='spanDistanceMax'>1km</span>
      </div>
      <div id="divDistances">&nbsp;</div>
    </div>

    <!----- PARTIE Map ----->
    <div id='divButtons'>
      <button class='classBoutonsCarte' id='butRafraichir' onclick='Rafraichir()' title="Rafraichir les données">Rafraichir</button>
      <button class='classBoutonsCarte' id='butChoixCarte' onclick='ChoixCarte()' title="Changer de carte">Carte</button>
    </div>

    <!-- Menu pour la carte -->
    <!-- Menu pour la carte avec Radio Buttons -->
    <div id="menuChoixCarte">
      <label>
        <input type="radio" class='classChoixCarte' id='idOsm' name="fondCarte" onclick="SelectionnerFond('osm')" checked>OpenStreetMap&nbsp;
      </label><br>
      <label>
        <input type="radio" class='classChoixCarte' id='idTopo' name="fondCarte" onclick="SelectionnerFond('topo')">OpenTopMap
      </label><br>
      <label>
        <input type="radio" class='classChoixCarte' id='idIgnPlan' name="fondCarte" onclick="SelectionnerFond('ignPlan')">IGN Plan
      </label><br>
      <label>
        <input type="radio" class='classChoixCarte' id='idSatellite' name="fondCarte" onclick="SelectionnerFond('satellite')">Satellite
      </label>
    </div>

    <link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
    <script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
    <script src='map.js'> </script>
    <link rel='stylesheet' type='text/css' href='map.css'>
    <div id='map'>
    </div>
  </div>
<div id='divBottomContainer'>
  <span id='spanBottom' class='classTextePetit'>
    <span><b>Légende</b>&nbsp;&nbsp;</span>
    <img id='imgLegendeDebut'>
    <span>&nbsp;Début&nbsp;&nbsp;&nbsp;</span>
    <img id='imgLegendePosition'>
    <span>&nbsp;Position&nbsp;&nbsp;&nbsp;</span>
    <img id='imgLegendeBivouac'>
    <span>&nbsp;Bivouac&nbsp;&nbsp;&nbsp;</span>
    <img id='imgLegendeFin'>
    <span>&nbsp;Fin</span>
  </span>
</div>
</body>
</html>
