<!DOCTYPE html>
<html lang="fr">
<head>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>GPX.Suivi</title>
  <meta charset='UTF-8'>
</head>
<body>

  <link rel='stylesheet' type='text/css' href='main.css'>
  <script src='main.js'> </script>
  <script src='driverSupabase.js'> </script>

  <!----- PARTIE ADMIN ----->
  <div id='divTopContainer'>
    <div id='panAdmin2' style='display: none'>
      <b>Admin</b><br>
      <button id='btnSTest'       onclick='ButTestClick()'>T</button>
      <button id='btnSEnvoi'      onclick='ButEnvoiClick()'>W</button>
      <button id='btnSLecture1'   onclick='ButLectureClick(1)'>R1</button>
      <button id='btnSLecture10'  onclick='ButLectureClick(10)'>R10</button>
      <button id='btnSClear'      onclick='ButClearClick()'>Clr</button>
      <button id='btnSLoad'       onclick='ButLoadClick()'>Charge GPX</button>
    </div>

    <!----- PARTIE Titre ----->
    <div id='titreSuivi' style='font-size: 1.8em;'>
      <span id='spanTitre'>GPX.Suivi</span>
      <span id='spanNom' style='opacity: 0;'>&nbsp;</span>
      <span id='divAvancement'></span>
    </div>

    <!----- PARTIE Administrateur ----->
    <div id='panAdmin'>
      <div id='txtAdmin'></div>
      <div style='height: 20px;'></div>
      <div class='classSaisieTitre' >Adresse URL</div>
      <input class='classSaisieTexte' id='txtUrl' type='text' placeholder=""><br>
      <div style='height: 15px;'></div>
      <div class='classSaisieTitre' >Clé</div>
      <input class='classSaisieTexte' id='txtKey' type='text' placeholder=""><br>
      <div style='height: 15px;'></div>
      <div class='classSaisieTitre' >Numéro utilisateur</div>
      <input class='classSaisieTexte' id='txtUsr' type='text' placeholder=""><br>
      <div style='height: 20px;'></div>
      <button id='butAdminValider' onclick='ValiderAdmin()' title="Valider les informations de connexion">Valider</button>
      <div style='height: 20px;'></div>
      <div id='txtValiderErreur'></div>
    </div>

    <!----- PARTIE Chargement ----->
    <div id='panChargement''>
      <span id='spanChargement'></span>
    </div>

    <!----- PARTIE Progression ----->
    <div id='panProgression'>                                                                       <!---->
      <div id='progression-container'>
        <span id='spanDeplacementCurseur'><img id='imgCurseur'></span>
        <span id='txtHeurePosition'></span>
        <div id='progression-track'></div>
        <div id='progression-fill'></div>
      </div>
      <div id="progression-labels">
        <span id='spanDistanceMin' onclick="PasseAdminOn();">0km</span><span id='spanDistanceMax' onclick='PasseAdminOff();'>1km</span>
      </div>
      <div id="divDistances">&nbsp;</div>
    </div>

    <!----- PARTIE Boutons ----->
    <div id='panButton' style='display: none;'>
      <button class='classBoutonsCarte' id='butRafraichir' onclick='Rafraichir()' title="Rafraichir les données">Rafraichir</button>
      <button class='classBoutonsCarte' id='butChoixCarte' onclick='ChoixCarte()' title="Changer de carte">Carte</button>
      <button class='classBoutonsCarte' id='butPartager' onclick='Partager()' title="Partager le lien">Partager</button>
      <button class='classBoutonsCarteAdmin' id='butAdmin' onclick='ListeItineraires()' style='display: none;'title='TODO'>Admin</button>
    </div>

    <!---Menu Admin -->
    <div id='panItineraires'>
      TOTO
    </div>


    <!----- PARTIE Map ----->
    <!-- Menu pour la carte avec Radio Buttons -->
    <div id="menuChoixCarte">
      <label><input type="radio" class='classChoixCarte' id='idOsm' name="fondCarte" onclick="SelectionnerFond('osm')" checked>OpenStreetMap&nbsp;
      </label><br>
      <label><input type="radio" class='classChoixCarte' id='idTopo' name="fondCarte" onclick="SelectionnerFond('topo')">OpenTopMap
      </label><br>
      <label><input type="radio" class='classChoixCarte' id='idIgnPlan' name="fondCarte" onclick="SelectionnerFond('ignPlan')">IGN Plan
      </label><br>
      <label><input type="radio" class='classChoixCarte' id='idSatellite' name="fondCarte" onclick="SelectionnerFond('satellite')">Satellite
      </label>
    </div>

    <link rel='stylesheet' href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css' />
    <script src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'></script>
    <script src='map.js'> </script>
    <link rel='stylesheet' type='text/css' href='map.css'>
    <div id='map' style='display: none;'>                                                           <!---->
    </div>
  </div>
<div id='divBottomContainer'>
  <span id='spanBottom' class='classTextePetit'>                                                    <!---->
    <span><b>Légende</b>&nbsp;&nbsp;</span>
    <img id='imgLegendeDebut'>
    <span>&nbsp;Début&nbsp;&nbsp;&nbsp;</span>
    <img id='imgLegendePosition'>
    <span>&nbsp;Position&nbsp;&nbsp;&nbsp;</span>
    <img id='imgLegendeBivouac'>
    <span>&nbsp;Bivouac&nbsp;&nbsp;&nbsp;</span>
    <img id='imgLegendeFin'>
    <span>&nbsp;Fin</span>
  </span>
</div>
</body>
</html>
